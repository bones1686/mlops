[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "adaptive-support-classifier"
version = "0.1.0"
description = "MLOps pipeline for customer-support intent classification"
requires-python = ">=3.10,<3.14"
dependencies = [
  "boto3>=1.34,<2",
  "datasets>=2.20,<5",
  "fastapi>=0.111,<1",
  "joblib>=1.3,<2",
  "mlflow>=3,<4",
  "pandas>=2.1,<4",
  "pydantic>=2.7,<3",
  "requests>=2.32,<3",
  "scikit-learn>=1.4,<2",
  "uvicorn[standard]>=0.30,<1",
]

[project.optional-dependencies]
dev = ["httpx>=0.27,<1", "pytest>=8,<10", "ruff>=0.5,<1"]
kubeflow = ["kfp>=2.8,<3"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"
