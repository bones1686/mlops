name: support-classifier-mlops

x-app-environment: &app-environment
  PROJECT_ROOT: /app
  MLFLOW_TRACKING_URI: http://mlflow:5000
  MLFLOW_S3_ENDPOINT_URL: http://minio:9000
  S3_ENDPOINT_URL: http://minio:9000
  AWS_ACCESS_KEY_ID: minioadmin
  AWS_SECRET_ACCESS_KEY: minioadmin
  DATA_BUCKET: support-data
  DATA_KEY: training/latest.csv
  MODEL_NAME: support-ticket-classifier
  MODEL_URI: models:/support-ticket-classifier@champion
  MODEL_PATH: /app/artifacts/model.joblib
  GIT_PYTHON_REFRESH: quiet

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: mlflow
      POSTGRES_USER: mlflow
      POSTGRES_PASSWORD: mlflow
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mlflow"]
      interval: 5s
      timeout: 5s
      retries: 20

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - minio-data:/data
    ports:
      - "9000:9000"
      - "9001:9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 20

  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >-
        mc alias set local http://minio:9000 minioadmin minioadmin &&
        mc mb --ignore-existing local/support-data &&
        mc mb --ignore-existing local/mlflow

  mlflow:
    build:
      context: .
      dockerfile: docker/Dockerfile.mlflow
    depends_on:
      postgres:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    environment:
      <<: *app-environment
    command:
      - mlflow
      - server
      - --host=0.0.0.0
      - --port=5000
      - --backend-store-uri=postgresql+psycopg2://mlflow:mlflow@postgres:5432/mlflow
      - --artifacts-destination=s3://mlflow
      - --serve-artifacts
      - --allowed-hosts=mlflow:5000,localhost:5000,127.0.0.1:5000,host.docker.internal:5000
    ports:
      - "5000:5000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5000/health')"]
      interval: 10s
      timeout: 5s
      retries: 30

  ingest:
    build:
      context: .
      dockerfile: docker/Dockerfile
    depends_on:
      minio-init:
        condition: service_completed_successfully
    environment:
      <<: *app-environment
    command: ["python", "-m", "support_classifier.ingest"]

  pipeline:
    build:
      context: .
      dockerfile: docker/Dockerfile
    depends_on:
      ingest:
        condition: service_completed_successfully
      mlflow:
        condition: service_healthy
    environment:
      <<: *app-environment
    volumes:
      - model-artifacts:/app/artifacts
    command: ["python", "-m", "support_classifier.pipeline_run"]

  api:
    build:
      context: .
      dockerfile: docker/Dockerfile
    depends_on:
      pipeline:
        condition: service_completed_successfully
    environment:
      <<: *app-environment
    expose:
      - "8000"
    volumes:
      - model-artifacts:/app/artifacts:ro
    restart: unless-stopped

  gateway:
    image: nginx:1.27-alpine
    depends_on:
      - api
    ports:
      - "8000:80"
    volumes:
      - ./docker/nginx.conf:/etc/nginx/nginx.conf:ro
    restart: unless-stopped

  airflow-init:
    build:
      context: .
      dockerfile: docker/Dockerfile.airflow
    environment:
      <<: *app-environment
      PROJECT_ROOT: /tmp/project
      AIRFLOW__CORE__EXECUTOR: SequentialExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: sqlite:////opt/airflow/airflow.db
    volumes:
      - airflow-data:/opt/airflow
      - ./dags:/opt/airflow/dags:ro
    command: ["bash", "-c", "airflow db migrate && airflow users create --username admin --password admin --firstname MLOps --lastname Student --role Admin --email admin@example.com || true"]

  airflow-webserver:
    build:
      context: .
      dockerfile: docker/Dockerfile.airflow
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    environment:
      <<: *app-environment
      PROJECT_ROOT: /tmp/project
      AIRFLOW__CORE__EXECUTOR: SequentialExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: sqlite:////opt/airflow/airflow.db
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    volumes:
      - airflow-data:/opt/airflow
      - ./dags:/opt/airflow/dags:ro
    command: ["airflow", "webserver"]
    ports:
      - "8080:8080"

  airflow-scheduler:
    build:
      context: .
      dockerfile: docker/Dockerfile.airflow
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    environment:
      <<: *app-environment
      PROJECT_ROOT: /tmp/project
      AIRFLOW__CORE__EXECUTOR: SequentialExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: sqlite:////opt/airflow/airflow.db
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    volumes:
      - airflow-data:/opt/airflow
      - ./dags:/opt/airflow/dags:ro
    command: ["airflow", "scheduler"]

volumes:
  airflow-data:
  minio-data:
  model-artifacts:
  postgres-data:
